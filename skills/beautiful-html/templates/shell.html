<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));

:root {
  --canvas: oklch(0.975 0.003 265); --surface: oklch(1 0 0);
  --ink: oklch(0.27 0.02 265);      --muted: oklch(0.52 0.015 265);
  --line: oklch(0.91 0.006 265);    --code: oklch(0.965 0.004 265);
  --accent: oklch(0.52 0.17 258);   --accent-soft: oklch(0.95 0.035 258);
  --ok: oklch(0.52 0.14 150);       --ok-soft: oklch(0.95 0.045 150);

  --bad: oklch(0.52 0.19 25);       --bad-soft: oklch(0.95 0.04 25);
}
.dark {
  --canvas: oklch(0.16 0.012 265); --surface: oklch(0.20 0.014 265);
  --ink: oklch(0.93 0.008 265);    --muted: oklch(0.68 0.012 265);
  --line: oklch(0.30 0.016 265);   --code: oklch(0.185 0.013 265);
  --accent: oklch(0.74 0.13 258);  --accent-soft: oklch(0.26 0.035 258);
  --ok: oklch(0.76 0.15 155);      --ok-soft: oklch(0.25 0.032 155);
  --warn: oklch(0.80 0.14 80);     --warn-soft: oklch(0.26 0.033 80);
  --bad: oklch(0.72 0.16 25);      --bad-soft: oklch(0.26 0.04 25);
}
@theme inline {
  --color-canvas: var(--canvas); --color-surface: var(--surface);
  --color-ink: var(--ink);       --color-muted: var(--muted);
  --color-line: var(--line);     --color-code: var(--code);
  --color-accent: var(--accent); --color-accent-soft: var(--accent-soft);
  --color-ok: var(--ok);         --color-ok-soft: var(--ok-soft);
  --color-warn: var(--warn);     --color-warn-soft: var(--warn-soft);
  --color-bad: var(--bad);       --color-bad-soft: var(--bad-soft);
}

@layer components {
  /* Icons. <svg class="icon"><use href="#i-name"/></svg> — see icons.md.
     fill:none + stroke:currentColor is what makes one inherit text-bad,
     text-muted, or anything else from the element it sits in. */
  .icon { @apply inline-block size-4 shrink-0 align-[-0.125em];
          fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }

  .prose-body { @apply text-[0.975rem]/7 text-ink; }
  .prose-body p { @apply my-4; }
  .prose-body ul { @apply my-4 list-disc space-y-1.5 pl-5 marker:text-muted; }
  .prose-body ol { @apply my-4 list-decimal space-y-1.5 pl-5 marker:text-muted; }
  .prose-body a { @apply text-accent underline decoration-accent/35 underline-offset-2 hover:decoration-accent; }
  .prose-body strong { @apply font-semibold text-ink; }
  .prose-body code { @apply rounded bg-code px-1.5 py-0.5 font-mono text-[0.85em] text-ink ring-1 ring-line/70; }
  .prose-body pre code { @apply bg-transparent p-0 text-[0.95em] ring-0; }
}

@media print {
  :root { --canvas: #fff; --surface: #fff; --ink: #000; --muted: #444; --line: #bbb; --code: #f2f2f2; }
  .no-print { display: none !important; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.75em; color: #555; word-break: break-all; }
}

<script>
document.getElementById('theme-toggle')?.addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
});
</script>
