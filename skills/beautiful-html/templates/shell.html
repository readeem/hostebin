<!-- Colours. Only the first block is a palette; everything else derives from
     it. On a hostebin server the theme link replaces it with the server's theme. -->
<style>
:root {
  color-scheme: dark;
  --canvas: #08040a;  --ink: #f4eff3;      --accent: #ff4d66;
  --ok: #4fd69c;      --warn: #f2c14e;     --bad: #ff6a3d;
  --t-cm: #857780;    --t-str: #f0c987;    --t-num: #f6a173;
  --t-kw: #ff8fa3;    --t-fn: #9fb7ff;
}
:root {
  --surface: color-mix(in oklab, var(--ink) 4%, var(--canvas));
  --raised:  color-mix(in oklab, var(--ink) 8%, var(--canvas));
  --muted:   color-mix(in oklab, var(--ink) 64%, var(--canvas));
  --line:    color-mix(in oklab, var(--ink) 9%, transparent);
  --line-hi: color-mix(in oklab, var(--ink) 18%, transparent);
  --accent-soft: color-mix(in oklab, var(--accent) 14%, transparent);
  --ok-soft:     color-mix(in oklab, var(--ok) 14%, transparent);
  --warn-soft:   color-mix(in oklab, var(--warn) 14%, transparent);
  --bad-soft:    color-mix(in oklab, var(--bad) 14%, transparent);
  --bar: 56px;
}
html { background: var(--canvas); color: var(--ink); font: 16px/1.6 "DM Sans", ui-sans-serif, system-ui, sans-serif; }
</style>
<link rel="stylesheet" media="screen" href=".hostebin/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js" defer></script>
<style type="text/tailwindcss">
@theme inline {
  --color-canvas: var(--canvas); --color-surface: var(--surface); --color-raised: var(--raised);
  --color-ink: var(--ink);       --color-muted: var(--muted);
  --color-line: var(--line);     --color-line-hi: var(--line-hi);
  --color-accent: var(--accent); --color-accent-soft: var(--accent-soft);
  --color-ok: var(--ok);         --color-ok-soft: var(--ok-soft);
  --color-warn: var(--warn);     --color-warn-soft: var(--warn-soft);
  --color-bad: var(--bad);       --color-bad-soft: var(--bad-soft);
  --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@layer base {
  html { text-size-adjust: 100%; -webkit-text-size-adjust: 100%;
         scroll-behavior: smooth; scroll-padding-top: calc(var(--bar) + 16px); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }
  code, pre { font-variant-ligatures: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, ::before, ::after { transition: none !important; animation: none !important; }
  }
}

@layer components {
  .icon { @apply inline-block size-4 shrink-0 align-[-0.125em];
          fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }

  .skip { @apply fixed top-2 left-2 z-50 -translate-y-24 rounded-lg bg-accent px-3 py-2 text-sm font-medium text-canvas focus:translate-y-0; }
  .wrap { @apply mx-auto w-full max-w-5xl px-5 sm:px-9; }
  .bar  { @apply sticky top-0 z-20 h-(--bar) border-b border-line backdrop-blur-md;
          background: color-mix(in srgb, var(--canvas) 84%, transparent); }
  .brand { @apply min-w-16 truncate font-mono text-[0.8rem] text-muted no-underline hover:text-ink; }
  .nav { @apply relative -mr-2.5 ml-auto flex min-w-0 gap-0.5 overflow-x-auto [scrollbar-width:none]; }
  .nav a { @apply shrink-0 rounded-lg px-2.5 py-1.5 text-sm whitespace-nowrap text-muted no-underline
                  hover:bg-raised hover:text-ink aria-[current=true]:bg-raised aria-[current=true]:text-ink; }

  .kicker { @apply font-mono text-[0.8rem] font-medium text-muted; }
  .h1 { @apply mt-4 max-w-[18ch] text-[clamp(2.3rem,7.4vw,4.1rem)] leading-[1.03] font-semibold tracking-[-0.035em] text-balance; }
  .lede { @apply mt-6 max-w-[56ch] text-[clamp(1.05rem,2.6vw,1.2rem)] leading-relaxed text-muted text-pretty; }
  .stats { @apply mt-8 flex flex-wrap gap-x-9 gap-y-4 border-t border-line pt-4; }
  .stats > div { @apply flex flex-col-reverse; }
  .stats dt { @apply text-[0.8rem] text-muted; }
  .stats dd { @apply text-[1.6rem] leading-tight font-semibold tracking-[-0.02em] tabular-nums; }
  .h2 { @apply text-[clamp(1.65rem,4.4vw,2.2rem)] leading-tight font-semibold tracking-[-0.025em] text-balance; }
  .intro { @apply mt-3 max-w-[64ch] text-muted text-pretty; }

  .card { @apply rounded-[18px] border border-line bg-surface; }
  .prose-body { @apply max-w-[66ch] text-[1rem]/7; }
  .prose-body p { @apply my-4; }
  .prose-body ul { @apply my-4 list-disc space-y-2 pl-5 marker:text-muted; }
  .prose-body ol { @apply my-4 list-decimal space-y-2 pl-5 marker:text-muted; }
  .prose-body a, a.link { @apply underline decoration-accent/60 underline-offset-[3px] hover:decoration-accent; }
  .prose-body strong { @apply font-semibold; }
  .prose-body code { @apply rounded-[5px] bg-raised px-[0.35em] py-[0.1em] font-mono text-[0.86em]; }

  .chip { @apply min-h-9 cursor-pointer rounded-full border border-line-hi px-3.5 text-sm text-muted hover:bg-raised hover:text-ink
                 aria-pressed:border-accent aria-pressed:bg-accent-soft aria-pressed:font-medium aria-pressed:text-ink; }
  .tile { @apply min-w-0 rounded-[18px] border border-line bg-surface p-4; }
  .tile-label { @apply font-mono text-[0.75rem] text-muted; }
  .tile-value { @apply mt-1.5 text-[clamp(1.35rem,5vw,1.75rem)] leading-tight font-semibold tracking-[-0.02em] tabular-nums; }

  .table-wrap { @apply overflow-x-auto rounded-[14px] border border-line; }
  .data { @apply w-full border-collapse text-sm; }
  .data th { @apply border-b border-line bg-surface px-4 py-3 text-left font-mono text-[0.72rem] font-normal tracking-wide whitespace-nowrap text-muted uppercase; }
  .data td { @apply border-t border-line px-4 py-2.5; }

  .hljs { color: var(--ink); background: transparent; }
  .hljs-comment, .hljs-quote { color: var(--t-cm); }
  .hljs-string, .hljs-regexp, .hljs-attr, .hljs-attribute, .hljs-symbol, .hljs-bullet { color: var(--t-str); }
  .hljs-number, .hljs-literal { color: var(--t-num); }
  .hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-type { color: var(--t-kw); }
  .hljs-title, .hljs-section, .hljs-selector-class { color: var(--t-fn); }
  .language-diff.hljs { @apply block w-max min-w-full px-4; }
  .language-diff .hljs-addition, .language-diff .hljs-deletion { @apply -mx-4 inline-block w-[calc(100%+2rem)] px-4; }
  .language-diff .hljs-addition { color: inherit; background: color-mix(in oklab, var(--ok) 14%, transparent); }
  .language-diff .hljs-deletion { color: inherit; background: color-mix(in oklab, var(--bad) 14%, transparent); }
  .language-diff .hljs-meta { color: var(--muted); }
}

@media print {
  :root {
    color-scheme: light;
    --canvas: #fff; --surface: #fff; --raised: #f2f2f2; --ink: #000; --muted: #444;
    --line: #bbb; --line-hi: #999; --accent: #b0002a;
    --ok: #1a7f4b; --warn: #9a6700; --bad: #c2410c;
    --t-cm: #767676; --t-str: #1a1a1a; --t-num: #1a1a1a; --t-kw: #000; --t-fn: #333;
  }
  .no-print { display: none !important; }
  .hljs-keyword { font-weight: 600; }
  .language-diff .hljs-addition, .language-diff .hljs-deletion { background: #f0f0f0; }
  details, details > * { display: block !important; }
  a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.75em; word-break: break-all; }
}
</style>
